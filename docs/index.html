<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haxball Futsal | Estadísticas</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <a class="brand" href="index.html">Haxball <span>Futsal</span></a>
            <nav>
                <a href="index.html" data-nav>Inicio</a>
                <a href="players.html" data-nav>Jugadores</a>
                <a href="matches.html" data-nav>Partidas</a>
                <a href="replays.html" data-nav>Repeticiones</a>
                <a href="verify.html" data-nav>Verificar cuenta</a>
                <div class="auth-box" id="auth-box"></div>
            </nav>
        </div>
    </header>
    <main class="container">
        <h1>Estadísticas del servidor</h1>
        <div class="grid grid-2">
            <div class="card">
                <h2>Top ELO</h2>
                <div id="top-players" class="loading">Cargando...</div>
            </div>
            <div class="card">
                <h2>Últimas partidas</h2>
                <div id="recent-matches" class="loading">Cargando...</div>
            </div>
        </div>
    </main>
    <footer>Haxball Futsal · Estadísticas públicas</footer>
    <script type="module">
        import { renderAuthBox, setActiveNav, makeSortableTable } from "./js/common.js";
        import { fetchTopPlayers, fetchRecentMatches, getLinkedPlayerName } from "./js/common.js";
        setActiveNav();
        const authBox = document.getElementById("auth-box");
        renderAuthBox(authBox).catch((e) => console.error("renderAuthBox error:", e));

        const topEl = document.getElementById("top-players");
        const recentEl = document.getElementById("recent-matches");

        Promise.all([fetchTopPlayers(10), getLinkedPlayerName().catch(() => null)])
            .then(([players, myName]) => {
            topEl.classList.remove("loading");
            if (!players.length) { topEl.innerHTML = '<div class="empty">Sin datos</div>'; return; }
            const table = document.createElement("table");
            const thead = document.createElement("thead");
            thead.innerHTML = "<tr><th>#</th><th>Jugador</th><th>ELO</th><th>PJ</th><th>G</th></tr>";
            table.append(thead);
            const tbody = document.createElement("tbody");
            players.forEach((p, i) => {
                const tr = document.createElement("tr");
                if (myName && p.name === myName) tr.classList.add("me");
                tr.innerHTML = `<td class="rank">${i + 1}</td><td><a href="player.html?name=${encodeURIComponent(p.name)}">${escapeHtml(p.name)}</a></td><td><strong>${p.elo}</strong></td><td>${p.matches}</td><td>${p.wins}</td>`;
                tbody.append(tr);
            });
            table.append(tbody);
            makeSortableTable(table);
            topEl.append(table);
            const more = document.createElement("div");
            more.style.marginTop = "10px";
            more.innerHTML = '<a href="players.html">Ver ranking completo →</a>';
            topEl.append(more);
        }).catch((e) => {
            console.error("index top error:", e);
            topEl.innerHTML = '<div class="empty">Error al cargar el ranking</div>';
        });

        fetchRecentMatches(10).then((matches) => {
            recentEl.classList.remove("loading");
            if (!matches.length) { recentEl.innerHTML = '<div class="empty">Sin partidas</div>'; return; }
            matches.forEach((m) => {
                const div = document.createElement("div");
                div.style.borderBottom = "1px solid var(--border)";
                div.style.padding = "8px 0";
                const type = m.type === "official" ? "OFICIAL" : "INFORMAL";
                const badge = `<span class="badge badge-${m.type}">${type}</span>`;
                const score = `<span class="match-score"><span class="score-red">${m.red_score}</span> - <span class="score-blue">${m.blue_score}</span></span>`;
                div.innerHTML = `${badge} ${score} <span style="color:var(--muted);font-size:12px">${m.map_name || ""}</span><br><span style="color:var(--muted);font-size:12px">${fmtDateShort(m.started_at)}</span>`;
                div.style.cursor = "pointer";
                div.addEventListener("click", () => location.href = "match.html?id=" + m.id);
                recentEl.append(div);
            });
            const more = document.createElement("div");
            more.style.marginTop = "10px";
            more.innerHTML = '<a href="matches.html">Ver todas las partidas →</a>';
            recentEl.append(more);
        });

        function fmtDateShort(iso) {
            if (!iso) return "—";
            const d = new Date(iso);
            return d.toLocaleString("es-ES", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        }
        function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    </script>
</body>
</html>
