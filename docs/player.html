<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugador | Haxball Futsal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <a class="brand" href="index.html">Haxball <span>Futsal</span></a>
            <nav>
                <a href="index.html" data-nav>Inicio</a>
                <a href="players.html" data-nav>Jugadores</a>
                <a href="matches.html" data-nav>Partidas</a>
                <a href="replays.html" data-nav>Repeticiones</a>
                <a href="verify.html" data-nav>Verificar cuenta</a>
                <div class="auth-box" id="auth-box"></div>
            </nav>
        </div>
    </header>
    <main class="container">
        <div id="profile" class="loading">Cargando...</div>
        <div id="stats" style="display:none">
            <div class="grid grid-3" id="stat-cards"></div>
            <h2>Historial ELO</h2>
            <div id="elo-history" class="loading">Cargando...</div>
            <h2>Partidas</h2>
            <div id="player-matches" class="loading">Cargando...</div>
            <h2>Goles</h2>
            <div id="player-goals" class="loading">Cargando goles...</div>
        </div>
    </main>
    <footer>Haxball Futsal · Estadísticas públicas</footer>
    <script type="module">
        import { renderAuthBox, setActiveNav, fetchPlayerByName, fetchPlayerMatches, fetchPlayerEloHistory, fetchPlayerGoals, fmtDate, fmtDistanceKm, fmtMinute, calcMatchRating, fmtRating, makeSortableTable, el } from "./js/common.js";
        setActiveNav();
        renderAuthBox(document.getElementById("auth-box"));

        const params = new URLSearchParams(location.search);
        const name = params.get("name");
        const profileEl = document.getElementById("profile");
        const statsEl = document.getElementById("stats");

        if (!name) {
            profileEl.innerHTML = '<div class="empty">Falta el parámetro name</div>';
        } else {
            fetchPlayerByName(name).then((player) => {
                profileEl.classList.remove("loading");
                if (!player) { profileEl.innerHTML = '<div class="empty">Jugador no encontrado</div>'; return; }
                const initial = (player.name || "?").charAt(0).toUpperCase();
                profileEl.innerHTML = "";
                const header = document.createElement("div");
                header.className = "card profile-header";
                header.innerHTML = `<div class="avatar">${initial}</div><div><h1 style="margin:0">${escapeHtml(player.name)}</h1><div style="display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap"><div><div class="elo-big">${player.elo}</div><div style="color:var(--muted)">ELO actual</div></div><div><div class="elo-big" style="color:var(--gold);font-size:36px"><span id="avg-rating">—</span></div><div style="color:var(--muted)">Valoración media</div></div></div></div>`;
                profileEl.append(header);
                statsEl.style.display = "block";

                const cards = document.getElementById("stat-cards");
                const items = [
                    ["Partidas", player.matches],
                    ["Oficiales", player.official_matches],
                    ["Informales", player.informal_matches],
                    ["Victorias", player.wins],
                    ["Derrotas", player.losses],
                    ["Empates", player.draws],
                    ["Goles", player.goals],
                    ["Goles en propia", player.own_goals],
                    ["Asistencias", player.assists || 0],
                    ["Tiros", player.shots || 0],
                    ["Tiros a puerta", player.shots_on_target || 0],
                    ["Pases", player.passes || 0],
                    ["Pases completados", player.completed_passes || 0],
                    ["% Pases", player.passes > 0 ? Math.round((player.completed_passes / player.passes) * 100) + "%" : "—"],
                    ["Intercepciones", player.interceptions || 0],
                    ["Paradas", player.saves || 0],
                    ["Pérdidas", player.possession_lost || 0],
                    ["Distancia", fmtDistanceKm(player.distance_covered)],
                    ["xG", (player.xg || 0).toFixed(2)],
                    ["Golazos", player.golazos || 0],
                    ["Oles", player.oles || 0],
                ];
                items.forEach(([label, val]) => {
                    const card = document.createElement("div");
                    card.className = "card stat";
                    card.innerHTML = `<div class="value">${val}</div><div class="label">${label}</div>`;
                    cards.append(card);
                });

                const eloEl = document.getElementById("elo-history");
                fetchPlayerEloHistory(player.id).then((hist) => {
                    eloEl.classList.remove("loading");
                    if (!hist.length) { eloEl.innerHTML = '<div class="empty">Sin historial ELO</div>'; return; }
                    const table = document.createElement("table");
                    table.innerHTML = "<thead><tr><th>Fecha</th><th>Antes</th><th>Cambio</th><th>Después</th></tr></thead>";
                    const tbody = document.createElement("tbody");
                    hist.forEach((h) => {
                        const tr = document.createElement("tr");
                        const change = h.elo_change > 0 ? `+${h.elo_change}` : h.elo_change;
                        const color = h.elo_change > 0 ? "var(--green)" : h.elo_change < 0 ? "var(--red)" : "var(--muted)";
                        tr.innerHTML = `<td>${fmtDate(h.created_at)}</td><td>${h.elo_before}</td><td style="color:${color};font-weight:700">${change}</td><td>${h.elo_after}</td>`;
                        tbody.append(tr);
                    });
                    table.append(tbody);
                    makeSortableTable(table);
                    eloEl.append(table);
                });

                const matchesEl = document.getElementById("player-matches");
                fetchPlayerMatches(player.id).then((rows) => {
                    matchesEl.classList.remove("loading");

                    // Valoración media: oficiales si hay, si no todas
                    const rated = rows.filter((r) => r.matches).map((r) => ({ rating: calcMatchRating(r, r.matches), official: r.matches.type === "official" }));
                    const official = rated.filter((x) => x.official);
                    const pool = official.length ? official : rated;
                    const avg = pool.length ? pool.reduce((s, x) => s + x.rating, 0) / pool.length : null;
                    const avgEl = document.getElementById("avg-rating");
                    if (avgEl) avgEl.textContent = avg != null ? fmtRating(avg) : "—";

                    if (!rows.length) { matchesEl.innerHTML = '<div class="empty">Sin partidas</div>'; return; }
                    const table = document.createElement("table");
                    table.innerHTML = "<thead><tr><th>Fecha</th><th>Tipo</th><th>Mapa</th><th>Equipo</th><th>Marcador</th><th>Val.</th><th>G</th><th>PP</th><th>A</th><th>T</th><th>TP</th><th>P</th><th>PC</th><th>I</th><th>Par</th><th>Pér</th><th>xG</th><th>⚡</th><th>Oles</th><th>ELO</th></tr></thead>";
                    const tbody = document.createElement("tbody");
                    rows.forEach((r) => {
                        const m = r.matches;
                        if (!m) return;
                        const tr = document.createElement("tr");
                        const type = m.type === "official" ? "OFICIAL" : "INFORMAL";
                        const score = `${m.red_score}-${m.blue_score}`;
                        const rating = fmtRating(calcMatchRating(r, m));
                        const elo = r.elo_change > 0 ? `+${r.elo_change}` : r.elo_change;
                        const eloColor = r.elo_change > 0 ? "var(--green)" : r.elo_change < 0 ? "var(--red)" : "var(--muted)";
                        const n = (v) => Number(v) || 0;
                        tr.innerHTML = `<td><a href="match.html?id=${m.id}">${fmtDate(m.started_at)}</a></td><td><span class="badge badge-${m.type}">${type}</span></td><td>${m.map_name || "—"}</td><td style="color:${r.team === "red" ? "var(--red)" : "var(--blue)"}">${r.team === "red" ? "ROJO" : "AZUL"}</td><td>${score}</td><td style="color:var(--gold);font-weight:700">${rating}</td><td>${n(r.goals)}</td><td>${n(r.own_goals)}</td><td>${n(r.assists)}</td><td>${n(r.shots)}</td><td>${n(r.shots_on_target)}</td><td>${n(r.passes)}</td><td>${n(r.completed_passes)}</td><td>${n(r.interceptions)}</td><td>${n(r.saves)}</td><td>${n(r.possession_lost)}</td><td>${(n(r.xg)).toFixed(2)}</td><td>${n(r.golazos)}</td><td>${n(r.oles)}</td><td style="color:${eloColor};font-weight:700">${r.elo_before != null ? elo : "—"}</td>`;
                        tbody.append(tr);
                    });
                    table.append(tbody);
                    makeSortableTable(table);
                    const wrap = document.createElement("div");
                    wrap.style.overflowX = "auto";
                    wrap.append(table);
                    const legend = document.createElement("div");
                    legend.style.cssText = "color:var(--muted);font-size:10px;margin-top:6px";
                    legend.textContent = "Val.=Valoración sobre 10 G=Goles PP=Propia A=Asist T=Tiros TP=T.Puerta P=Pases PC=P.Completados I=Intercept Par=Paradas Pér=Pérdidas ⚡=Golazos";
                    wrap.append(legend);
                    matchesEl.append(wrap);
                });

                const goalsEl = document.getElementById("player-goals");
                fetchPlayerGoals(player).then((goals) => {
                    goalsEl.classList.remove("loading");
                    if (!goals.length) { goalsEl.innerHTML = '<div class="empty">Sin goles registrados</div>'; return; }
                    const table = document.createElement("table");
                    table.innerHTML = "<thead><tr><th>Fecha</th><th>Partido</th><th>Minuto</th><th>Equipo</th><th>Marcador</th><th>xG</th><th>Prob.</th><th>Vel. km/h</th><th>Asistencia</th><th>Golazo</th><th>Repetición</th></tr></thead>";
                    const tbody = document.createElement("tbody");
                    goals.forEach((g) => {
                        const m = g.matches || {};
                        const tr = document.createElement("tr");
                        const score = g.score_before && g.score_after
                            ? g.score_before + " → " + g.score_after
                            : (m.red_score != null && m.blue_score != null ? m.red_score + "-" + m.blue_score : "—");
                        const xg = g.xg != null ? Number(g.xg) : null;
                        const xgText = xg != null ? xg.toFixed(2).replace(".", ",") : "—";
                        const probText = xg != null ? Math.round(xg * 100) + "%" : "—";
                        const replayLink = g.replay_url
                            ? `<a href="replays.html?goal=${encodeURIComponent(g.id)}&autoplay=1" title="Ver la repetición en esta web">Ver ▶</a>`
                            : "—";
                        tr.innerHTML = `
                            <td>${fmtDate(m.started_at)}</td>
                            <td><a href="match.html?id=${encodeURIComponent(m.id || "")}">${m.map_name || "Partida"}</a></td>
                            <td>${fmtMinute(g.elapsed_seconds)}</td>
                            <td style="color:${g.scoring_team === "red" ? "var(--red)" : "var(--blue)"}">${g.scoring_team === "red" ? "ROJO" : "AZUL"}</td>
                            <td data-sort-value="${parseScore(score)}">${escapeHtml(score)}</td>
                            <td data-sort-value="${xg != null ? xg : ""}">${xgText}</td>
                            <td data-sort-value="${xg != null ? xg : ""}">${probText}</td>
                            <td>${g.ball_speed_kmh != null ? g.ball_speed_kmh : "—"}</td>
                            <td>${g.assist_name ? escapeHtml(g.assist_name) : "—"}</td>
                            <td>${g.is_golazo ? "⚡ Sí" : "—"}</td>
                            <td>${replayLink}</td>
                        `;
                        tbody.append(tr);
                    });
                    table.append(tbody);
                    makeSortableTable(table);
                    goalsEl.append(table);
                }).catch((err) => {
                    console.error(err);
                    goalsEl.classList.remove("loading");
                    goalsEl.innerHTML = '<div class="empty">No se pudieron cargar los goles</div>';
                });
            });
        }

        function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
        function parseScore(s){const last=String(s).split("→").pop().trim();const m=last.match(/^(\d+)-(\d+)$/);return m?Number(m[1])*1000+Number(m[2]):"";}
    </script>
</body>
</html>
