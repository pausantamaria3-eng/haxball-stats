<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partida | Haxball Futsal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <a class="brand" href="index.html">Haxball <span>Futsal</span></a>
            <nav>
                <a href="index.html" data-nav>Inicio</a>
                <a href="players.html" data-nav>Jugadores</a>
                <a href="matches.html" data-nav>Partidas</a>
                <a href="verify.html" data-nav>Verificar cuenta</a>
                <div class="auth-box" id="auth-box"></div>
            </nav>
        </div>
    </header>
    <main class="container">
        <div id="match-detail" class="loading">Cargando...</div>
    </main>
    <footer>Haxball Futsal · Estadísticas públicas</footer>
    <script type="module">
        import { renderAuthBox, setActiveNav, fetchMatchDetail, getLinkedPlayerName, fmtDistanceKm } from "./js/common.js";
        setActiveNav();
        renderAuthBox(document.getElementById("auth-box"));

        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        const container = document.getElementById("match-detail");

        if (!id) {
            container.innerHTML = '<div class="empty">Falta el parámetro id</div>';
        } else {
            Promise.all([fetchMatchDetail(id), getLinkedPlayerName().catch(() => null)]).then(([{ match, participants, goals }, myName]) => {
                container.classList.remove("loading");
                if (!match) { container.innerHTML = '<div class="empty">Partida no encontrada</div>'; return; }

                const type = match.type === "official" ? "OFICIAL" : "INFORMAL";
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <h1 style="margin:0 0 10px">${type} · ${match.map_name || "—"}</h1>
                    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
                        <span class="match-score"><span class="score-red">${match.red_score}</span> - <span class="score-blue">${match.blue_score}</span></span>
                        <span class="badge badge-${match.status}">${match.status}</span>
                        ${match.manual ? '<span class="badge badge-informal">manual</span>' : ""}
                        ${match.elo_eligible ? '<span class="badge badge-completed">ELO</span>' : ""}
                    </div>
                    <div style="color:var(--muted);font-size:13px">
                        Inicio: ${fmtDate(match.started_at)} · Fin: ${fmtDate(match.ended_at)} · Duración: ${fmtDur(match.duration_seconds)}
                        ${match.end_reason ? " · Fin: " + match.end_reason : ""}
                        ${match.spectator_name ? " · Espectador: " + escapeHtml(match.spectator_name) : ""}
                    </div>
                `;
                container.append(card);

                // Posesión
                if (match.red_possession != null || match.blue_possession != null) {
                    const possCard = document.createElement("div");
                    possCard.className = "card";
                    const redP = match.red_possession ?? 0;
                    const blueP = match.blue_possession ?? 0;
                    possCard.innerHTML = `
                        <h2>Posesión del balón</h2>
                        <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
                            <div style="flex:1;min-width:120px">
                                <div style="color:var(--red);font-weight:700;font-size:14px">ROJO ${redP}%</div>
                                <div style="background:var(--bg2);border-radius:4px;height:8px;overflow:hidden;margin-top:4px"><div style="background:var(--red);height:100%;width:${redP}%"></div></div>
                            </div>
                            <div style="flex:1;min-width:120px">
                                <div style="color:var(--blue);font-weight:700;font-size:14px">AZUL ${blueP}%</div>
                                <div style="background:var(--bg2);border-radius:4px;height:8px;overflow:hidden;margin-top:4px"><div style="background:var(--blue);height:100%;width:${blueP}%"></div></div>
                            </div>
                        </div>
                    `;
                    container.append(possCard);
                }

                // Participantes en dos columnas
                const pCard = document.createElement("div");
                pCard.className = "card";
                pCard.innerHTML = "<h2>Participantes</h2>";
                const cols = document.createElement("div");
                cols.className = "grid grid-2";
                cols.style.gap = "16px";

                function buildTeamTable(team, colorVar) {
                    const wrap = document.createElement("div");
                    const title = document.createElement("h3");
                    title.style.color = colorVar;
                    title.textContent = team === "red" ? "ROJO" : "AZUL";
                    wrap.append(title);
                    const table = document.createElement("table");
                    table.innerHTML = "<thead><tr><th>Jugador</th><th>G</th><th>PP</th><th>T</th><th>TP</th><th>P</th><th>PC</th><th>A</th><th>I</th><th>Par</th><th>Pér</th><th>Dist km</th><th>xG</th><th>⚡</th><th>Oles</th></tr></thead>";
                    const tbody = document.createElement("tbody");
                    const teamPlayers = participants.filter((p) => p.team === team);
                    if (!teamPlayers.length) {
                        const tr = document.createElement("tr");
                        tr.innerHTML = '<td colspan="15" class="empty" style="text-align:center">Sin jugadores</td>';
                        tbody.append(tr);
                    } else {
                        teamPlayers.forEach((p) => {
                            const tr = document.createElement("tr");
                            if (myName && p.player_name === myName) tr.classList.add("me");
                            const elo = p.elo_before != null ? (p.elo_change > 0 ? `+${p.elo_change}` : p.elo_change) : "—";
                            const pc = p.passes > 0 ? Math.round((p.completed_passes / p.passes) * 100) + "%" : "—";
                            tr.innerHTML = `
                                <td><a href="player.html?name=${encodeURIComponent(p.player_name)}">${escapeHtml(p.player_name)}</a></td>
                                <td>${p.goals}</td>
                                <td>${p.own_goals}</td>
                                <td>${p.shots || 0}</td>
                                <td>${p.shots_on_target || 0}</td>
                                <td>${p.passes || 0}</td>
                                <td>${p.completed_passes || 0}</td>
                                <td>${p.assists || 0}</td>
                                <td>${p.interceptions || 0}</td>
                                <td>${p.saves || 0}</td>
                                <td>${p.possession_lost || 0}</td>
                                <td>${fmtDistanceKm(p.distance_covered)}</td>
                                <td>${(p.xg || 0).toFixed(2)}</td>
                                <td>${p.golazos || 0}</td>
                                <td>${p.oles || 0}</td>
                            `;
                            tbody.append(tr);
                        });
                    }
                    table.append(tbody);
                    wrap.append(table);

                    // Leyenda compacta
                    const legend = document.createElement("div");
                    legend.style.cssText = "color:var(--muted);font-size:10px;margin-top:6px";
                    legend.textContent = "G=Goles PP=Propia T=Tiros TP=T.Puerta P=Pases PC=P.Completados A=Asist I=Intercept Par=Paradas Pér=Pérdidas Dist km=Distancia (10 u = 1 m) ⚡=Golazos Oles=Oles";
                    wrap.append(legend);
                    return wrap;
                }

                cols.append(buildTeamTable("red", "var(--red)"));
                cols.append(buildTeamTable("blue", "var(--blue)"));
                pCard.append(cols);
                container.append(pCard);

                // Goles
                if (goals.length) {
                    const gCard = document.createElement("div");
                    gCard.className = "card";
                    gCard.innerHTML = "<h2>Goles</h2>";
                    const gTable = document.createElement("table");
                    gTable.innerHTML = "<thead><tr><th>Tiempo</th><th>Equipo</th><th>Jugador</th><th>xG</th><th>Tipo</th></tr></thead>";
                    const gBody = document.createElement("tbody");
                    goals.forEach((g) => {
                        const tr = document.createElement("tr");
                        if (myName && g.player_name === myName) tr.classList.add("me");
                        const own = g.is_own_goal ? " (propia)" : "";
                        const xg = g.xg != null ? Number(g.xg).toFixed(2) : "—";
                        const golazo = g.is_golazo ? " ⚡" : "";
                        tr.innerHTML = `<td>${fmtTime(g.elapsed_seconds)}</td><td style="color:${g.scoring_team === "red" ? "var(--red)" : "var(--blue)"}">${g.scoring_team === "red" ? "ROJO" : "AZUL"}</td><td>${g.player_name ? escapeHtml(g.player_name) + own + golazo : "desconocido"}</td><td>${xg}</td><td>${g.estimated ? "estimado" : "—"}</td>`;
                        gBody.append(tr);
                    });
                    gTable.append(gBody);
                    gCard.append(gTable);
                    container.append(gCard);
                }
            });
        }

        function fmtDate(iso){if(!iso)return"—";const d=new Date(iso);return d.toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
        function fmtDur(s){if(typeof s!=="number"||!isFinite(s))return"—";const m=Math.floor(s/60);const r=Math.round(s%60);return m+":"+String(r).padStart(2,"0");}
        function fmtTime(s){if(typeof s!=="number"||!isFinite(s))return"—";const m=Math.floor(s/60);const r=Math.round(s%60);return m+":"+String(r).padStart(2,"0");}
        function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    </script>
</body>
</html>
