<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partida | Haxball Futsal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <a class="brand" href="index.html">Haxball <span>Futsal</span></a>
            <nav>
                <a href="index.html" data-nav>Inicio</a>
                <a href="players.html" data-nav>Jugadores</a>
                <a href="matches.html" data-nav>Partidas</a>
                <a href="replays.html" data-nav>Repeticiones</a>
                <a href="verify.html" data-nav>Verificar cuenta</a>
                <div class="auth-box" id="auth-box"></div>
            </nav>
        </div>
    </header>
    <main class="container">
        <div id="match-detail" class="loading">Cargando...</div>
    </main>
    <footer>Haxball Futsal · Estadísticas públicas</footer>
    <script type="module">
        import { renderAuthBox, setActiveNav, fetchMatchDetail, getLinkedPlayerName, fmtDistanceKm, calcMatchRating, fmtRating, pickMatchMvp, makeSortableTable } from "./js/common.js";
        setActiveNav();
        renderAuthBox(document.getElementById("auth-box"));

        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        const container = document.getElementById("match-detail");

        if (!id) {
            container.innerHTML = '<div class="empty">Falta el parámetro id</div>';
        } else {
            Promise.all([fetchMatchDetail(id), getLinkedPlayerName().catch(() => null)]).then(([{ match, participants, goals }, myName]) => {
                container.classList.remove("loading");
                if (!match) { container.innerHTML = '<div class="empty">Partida no encontrada</div>'; return; }

                const type = match.type === "official" ? "OFICIAL" : "INFORMAL";
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <h1 style="margin:0 0 6px;text-align:center">${type} · ${match.map_name || "—"}</h1>
                    <div style="display:flex;justify-content:center;align-items:center;gap:28px;flex-wrap:wrap;margin:8px 0 12px">
                        <span style="color:var(--red);font-weight:800;font-size:20px;letter-spacing:1px">ROJO</span>
                        <span class="match-score" style="font-size:56px;line-height:1;letter-spacing:4px"><span class="score-red">${match.red_score}</span> <span style="color:var(--muted);font-size:36px">-</span> <span class="score-blue">${match.blue_score}</span></span>
                        <span style="color:var(--blue);font-weight:800;font-size:20px;letter-spacing:1px">AZUL</span>
                    </div>
                    <div style="text-align:center;margin-bottom:10px">
                        <span class="badge badge-${match.status}">${match.status}</span>
                        ${match.manual ? '<span class="badge badge-informal">manual</span>' : ""}
                        ${match.elo_eligible ? '<span class="badge badge-completed">ELO</span>' : ""}
                    </div>
                    <div style="color:var(--muted);font-size:13px;text-align:center">
                        Inicio: ${fmtDate(match.started_at)} · Fin: ${fmtDate(match.ended_at)} · Duración: ${fmtDur(match.duration_seconds)}
                        ${match.end_reason ? " · Fin: " + match.end_reason : ""}
                        ${match.spectator_name ? " · Espectador: " + escapeHtml(match.spectator_name) : ""}
                    </div>
                `;
                container.append(card);

                // MVP del partido (jugador con mayor valoración)
                const mvp = pickMatchMvp(participants, match);
                if (mvp) {
                    const mvpCard = document.createElement("div");
                    mvpCard.className = "card mvp-banner";
                    mvpCard.innerHTML = `
                        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
                            <div style="font-size:20px;font-weight:800;color:var(--gold)">👑 MVP del partido</div>
                            <div style="font-size:18px;font-weight:700;color:var(--gold)">${fmtRating(mvp.rating)}</div>
                        </div>
                        <div style="margin-top:6px;font-size:16px">
                            <a href="player.html?name=${encodeURIComponent(mvp.player.player_name)}">${escapeHtml(mvp.player.player_name)}</a>
                            <span style="color:var(--muted);font-size:13px"> · ${mvp.player.team === "red" ? "ROJO" : "AZUL"}</span>
                        </div>
                    `;
                    container.append(mvpCard);
                }

                // Posesión
                if (match.red_possession != null || match.blue_possession != null) {
                    const possCard = document.createElement("div");
                    possCard.className = "card";
                    const redP = match.red_possession ?? 0;
                    const blueP = match.blue_possession ?? 0;
                    const totalP = redP + blueP || 1;
                    const redW = (redP / totalP) * 100;
                    const blueW = (blueP / totalP) * 100;
                    possCard.innerHTML = `
                        <h2>Posesión del balón</h2>
                        <div style="display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:14px;margin-bottom:5px">
                            <span style="color:var(--red)">ROJO ${redP}%</span>
                            <span style="color:var(--blue)">AZUL ${blueP}%</span>
                        </div>
                        <div style="background:var(--bg2);border-radius:4px;height:10px;overflow:hidden;display:flex">
                            <div style="background:var(--red);height:100%;width:${redW}%"></div>
                            <div style="background:var(--blue);height:100%;width:${blueW}%"></div>
                        </div>
                    `;
                    container.append(possCard);
                }

                // Participantes en dos columnas
                const pCard = document.createElement("div");
                pCard.className = "card";
                pCard.innerHTML = "<h2>Participantes</h2>";
                const blocks = document.createElement("div");
                blocks.style.cssText = "display:flex;flex-direction:column;gap:22px";

                function buildTeamTable(team, colorVar) {
                    const wrap = document.createElement("div");
                    wrap.style.cssText = "overflow-x:auto;padding:4px 2px 8px;border-radius:8px";
                    const title = document.createElement("h3");
                    title.style.cssText = `color:${colorVar};font-size:18px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid ${colorVar}`;
                    title.textContent = team === "red" ? "EQUIPO ROJO" : "EQUIPO AZUL";
                    wrap.append(title);
                    const table = document.createElement("table");
                    table.innerHTML = "<thead><tr><th>Jugador</th><th>Val.</th><th>G</th><th>PP</th><th>T</th><th>TP</th><th>P</th><th>PC</th><th>A</th><th>I</th><th>Par</th><th>Pér</th><th>Dist km</th><th>xG</th><th>⚡</th><th>Oles</th></tr></thead>";
                    const tbody = document.createElement("tbody");
                    const teamPlayers = participants.filter((p) => p.team === team);
                    if (!teamPlayers.length) {
                        const tr = document.createElement("tr");
                        tr.innerHTML = '<td colspan="16" class="empty" style="text-align:center">Sin jugadores</td>';
                        tbody.append(tr);
                    } else {
                        teamPlayers.forEach((p) => {
                            const tr = document.createElement("tr");
                            if (myName && p.player_name === myName) tr.classList.add("me");
                            const isMvp = mvp && p === mvp.player;
                            if (isMvp) tr.classList.add("mvp");
                            const abandoned = Boolean(p.left_match || p.moved_to_spectator);
                            if (abandoned) tr.classList.add("abandoned");
                            const elo = p.elo_before != null ? (p.elo_change > 0 ? `+${p.elo_change}` : p.elo_change) : "—";
                            const pc = p.passes > 0 ? Math.round((p.completed_passes / p.passes) * 100) + "%" : "—";
                            tr.innerHTML = `
                                <td>${isMvp ? "👑 " : ""}<a href="player.html?name=${encodeURIComponent(p.player_name)}">${escapeHtml(p.player_name)}</a>${isMvp ? ' <span class="mvp-badge">MVP</span>' : ""}${abandoned ? ' <span class="abandoned-badge">🚪 abandonado</span>' : ""}</td>
                                <td style="color:var(--gold);font-weight:700">${fmtRating(calcMatchRating(p, match))}</td>
                                <td>${p.goals}</td>
                                <td>${p.own_goals}</td>
                                <td>${p.shots || 0}</td>
                                <td>${p.shots_on_target || 0}</td>
                                <td>${p.passes || 0}</td>
                                <td>${p.completed_passes || 0}</td>
                                <td>${p.assists || 0}</td>
                                <td>${p.interceptions || 0}</td>
                                <td>${p.saves || 0}</td>
                                <td>${p.possession_lost || 0}</td>
                                <td>${fmtDistanceKm(p.distance_covered)}</td>
                                <td>${(p.xg || 0).toFixed(2)}</td>
                                <td>${p.golazos || 0}</td>
                                <td>${p.oles || 0}</td>
                            `;
                            tbody.append(tr);
                        });
                    }
                    table.append(tbody);
                    makeSortableTable(table);
                    wrap.append(table);

                    // Leyenda compacta
                    const legend = document.createElement("div");
                    legend.style.cssText = "color:var(--muted);font-size:10px;margin-top:6px";
                    legend.textContent = "Val.=Valoración sobre 10 G=Goles PP=Propia T=Tiros TP=T.Puerta P=Pases PC=P.Completados A=Asist I=Intercept Par=Paradas Pér=Pérdidas Dist km=Distancia (10 u = 1 m) ⚡=Golazos Oles=Oles";
                    wrap.append(legend);
                    return wrap;
                }

                blocks.append(buildTeamTable("red", "var(--red)"));
                blocks.append(buildTeamTable("blue", "var(--blue)"));
                pCard.append(blocks);
                container.append(pCard);

                // Goles
                if (goals.length) {
                    const gCard = document.createElement("div");
                    gCard.className = "card";
                    gCard.innerHTML = "<h2>Goles</h2>";
                    const gTable = document.createElement("table");
                    gTable.innerHTML = "<thead><tr><th>Tiempo</th><th>Equipo</th><th>Jugador</th><th>xG</th><th>Tipo</th><th>Repetición</th></tr></thead>";
                    const gBody = document.createElement("tbody");
                    goals.forEach((g) => {
                        const tr = document.createElement("tr");
                        if (myName && g.player_name === myName) tr.classList.add("me");
                        const own = g.is_own_goal ? " (propia)" : "";
                        const xg = g.xg != null ? Number(g.xg).toFixed(2) : "—";
                        const golazo = g.is_golazo ? " ⚡" : "";
                        const replayLink = g.replay_url
                            ? `<a href="replays.html?goal=${encodeURIComponent(g.id)}&autoplay=1" title="Ver la repetición en esta web">Ver ▶</a>`
                            : "—";
                        tr.innerHTML = `<td>${fmtTime(g.elapsed_seconds)}</td><td style="color:${g.scoring_team === "red" ? "var(--red)" : "var(--blue)"}">${g.scoring_team === "red" ? "ROJO" : "AZUL"}</td><td>${g.player_name ? escapeHtml(g.player_name) + own + golazo : "desconocido"}</td><td>${xg}</td><td>${g.estimated ? "estimado" : "—"}</td><td>${replayLink}</td>`;
                        gBody.append(tr);
                    });
                    gTable.append(gBody);
                    makeSortableTable(gTable);
                    gCard.append(gTable);
                    container.append(gCard);
                }
            });
        }

        function fmtDate(iso){if(!iso)return"—";const d=new Date(iso);return d.toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
        function fmtDur(s){if(typeof s!=="number"||!isFinite(s))return"—";const m=Math.floor(s/60);const r=Math.round(s%60);return m+":"+String(r).padStart(2,"0");}
        function fmtTime(s){if(typeof s!=="number"||!isFinite(s))return"—";const m=Math.floor(s/60);const r=Math.round(s%60);return m+":"+String(r).padStart(2,"0");}
        function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    </script>
</body>
</html>
