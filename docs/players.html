<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugadores | Haxball Futsal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <a class="brand" href="index.html">Haxball <span>Futsal</span></a>
            <nav>
                <a href="index.html" data-nav>Inicio</a>
                <a href="players.html" data-nav>Jugadores</a>
                <a href="matches.html" data-nav>Partidas</a>
                <a href="verify.html" data-nav>Verificar cuenta</a>
                <div class="auth-box" id="auth-box"></div>
            </nav>
        </div>
    </header>
    <main class="container">
        <h1>Ranking de jugadores</h1>
        <div id="players-table" class="loading">Cargando...</div>
    </main>
    <footer>Haxball Futsal · Estadísticas públicas</footer>
    <script type="module">
        import { renderAuthBox, setActiveNav, fetchTopPlayers } from "./js/common.js";
        setActiveNav();
        renderAuthBox(document.getElementById("auth-box"));

        const container = document.getElementById("players-table");
        fetchTopPlayers(100).then((players) => {
            container.classList.remove("loading");
            if (!players.length) { container.innerHTML = '<div class="empty">Sin jugadores</div>'; return; }
            const table = document.createElement("table");
            table.innerHTML = "<thead><tr><th>#</th><th>Jugador</th><th>ELO</th><th>PJ</th><th>PO</th><th>PI</th><th>G</th><th>P</th><th>E</th><th>Goles</th><th>PP</th></tr></thead>";
            const tbody = document.createElement("tbody");
            players.forEach((p, i) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td class="rank">${i+1}</td><td><a href="player.html?name=${encodeURIComponent(p.name)}">${escapeHtml(p.name)}</a></td><td><strong>${p.elo}</strong></td><td>${p.matches}</td><td>${p.official_matches}</td><td>${p.informal_matches}</td><td>${p.wins}</td><td>${p.losses}</td><td>${p.draws}</td><td>${p.goals}</td><td>${p.own_goals}</td>`;
                tbody.append(tr);
            });
            table.append(tbody);
            container.append(table);
        });

        function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    </script>
</body>
</html>
