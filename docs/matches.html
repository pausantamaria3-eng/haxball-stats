<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidas | Haxball Futsal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <a class="brand" href="index.html">Haxball <span>Futsal</span></a>
            <nav>
                <a href="index.html" data-nav>Inicio</a>
                <a href="players.html" data-nav>Jugadores</a>
                <a href="matches.html" data-nav>Partidas</a>
                <a href="replays.html" data-nav>Repeticiones</a>
                <a href="verify.html" data-nav>Verificar cuenta</a>
                <div class="auth-box" id="auth-box"></div>
            </nav>
        </div>
    </header>
    <main class="container">
        <h1>Partidas</h1>
        <div id="matches-list" class="loading">Cargando...</div>
        <div id="pagination" style="text-align:center;margin-top:20px"></div>
    </main>
    <footer>Haxball Futsal · Estadísticas públicas</footer>
    <script type="module">
        import { renderAuthBox, setActiveNav, getLinkedPlayerName, calcMatchRating, fmtRating, pickMatchMvp } from "./js/common.js";
        import { supabase } from "./js/supabase.js";
        setActiveNav();
        renderAuthBox(document.getElementById("auth-box"));

        const PAGE_SIZE = 10;
        let offset = 0;
        const listEl = document.getElementById("matches-list");
        const pagEl = document.getElementById("pagination");

        async function load() {
            listEl.classList.add("loading");
            listEl.innerHTML = "Cargando...";
            const { data: matches, error } = await supabase
                .from("matches")
                .select("id,type,status,map_name,started_at,red_score,blue_score,elo_eligible,manual,end_reason,red_possession,blue_possession")
                .order("started_at", { ascending: false })
                .range(offset, offset + PAGE_SIZE - 1);

            if (error) { listEl.innerHTML = '<div class="empty">Error al cargar</div>'; console.error(error); return; }
            if (!matches || !matches.length) { listEl.innerHTML = '<div class="empty">No hay más partidas</div>'; pagEl.innerHTML = ""; return; }

            const ids = matches.map((m) => m.id);
            const { data: parts } = await supabase
                .from("match_participants")
                .select("match_id,player_name,team,goals,own_goals,assists,saves,interceptions,shots,shots_on_target,passes,completed_passes,possession_lost,oles,golazos,xg,left_match,moved_to_spectator,elo_change,elo_before")
                .in("match_id", ids);

            const byMatch = {};
            (parts || []).forEach((p) => {
                if (!byMatch[p.match_id]) byMatch[p.match_id] = { red: [], blue: [] };
                byMatch[p.match_id][p.team].push(p);
            });

            const myName = await getLinkedPlayerName().catch(() => null);

            listEl.classList.remove("loading");
            listEl.innerHTML = "";

            matches.forEach((m) => {
                const card = document.createElement("div");
                card.className = "card";
                const type = m.type === "official" ? "OFICIAL" : "INFORMAL";
                const statusBadge = `<span class="badge badge-${m.status}">${m.status}</span>`;
                const score = `<span class="match-score"><span class="score-red">${m.red_score}</span> - <span class="score-blue">${m.blue_score}</span></span>`;
                const allParts = [...(byMatch[m.id]?.red || []), ...(byMatch[m.id]?.blue || [])];
                const mvp = pickMatchMvp(allParts, m);
                const mvpBadge = mvp
                    ? `<span class="mvp-badge">👑 MVP ${escapeHtml(mvp.player.player_name)} ${fmtRating(mvp.rating)}</span>`
                    : "";

                const header = document.createElement("div");
                header.style.cssText = "display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px";
                header.innerHTML = `<div>${statusBadge} <span class="badge badge-${m.type}">${type}</span> <strong>${m.map_name || "—"}</strong> ${mvpBadge}</div>${score}`;
                card.append(header);

                const meta = document.createElement("div");
                meta.style.cssText = "color:var(--muted);font-size:14px;margin-bottom:10px";
                meta.innerHTML = `${fmtDate(m.started_at)}${m.manual ? " · manual" : ""}${m.end_reason ? " · " + m.end_reason : ""}${m.elo_eligible ? " · ELO" : ""}`;
                card.append(meta);

                // Dos columnas de participantes
                const cols = document.createElement("div");
                cols.className = "grid grid-2";
                cols.style.gap = "12px";

                function buildCol(team, colorVar) {
                    const wrap = document.createElement("div");
                    const title = document.createElement("div");
                    title.style.cssText = `color:${colorVar};font-weight:700;font-size:15px;margin-bottom:4px`;
                    title.textContent = team === "red" ? "ROJO" : "AZUL";
                    wrap.append(title);
                    const list = document.createElement("div");
                    const teamParts = (byMatch[m.id]?.[team] || []).sort((a, b) => (b.goals - a.goals) || a.player_name.localeCompare(b.player_name));
                    if (!teamParts.length) {
                        list.innerHTML = '<span style="color:var(--muted);font-size:14px">Sin jugadores</span>';
                    } else {
                        teamParts.forEach((p) => {
                            const row = document.createElement("div");
                            row.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:15px;border-bottom:1px solid var(--border)";
                            if (myName && p.player_name === myName) row.classList.add("me");
                            const isMvp = mvp && p === mvp.player;
                            if (isMvp) row.classList.add("mvp-row");
                            const abandoned = Boolean(p.left_match || p.moved_to_spectator);
                            if (abandoned) row.classList.add("abandoned-row");
                            const nameLink = `${isMvp ? "👑 " : ""}<a href="player.html?name=${encodeURIComponent(p.player_name)}">${escapeHtml(p.player_name)}</a>${abandoned ? ' <span class="abandoned-badge">🚪 abandonado</span>' : ""}`;

                            // Solo se muestran las estadísticas que tienen valor (> 0)
                            const bits = [];
                            if ((p.goals || 0) > 0) bits.push(`⚽${p.goals}`);
                            if ((p.assists || 0) > 0) bits.push(`🅰️${p.assists}`);
                            if ((p.saves || 0) > 0) bits.push(`🧤${p.saves}`);
                            if ((p.own_goals || 0) > 0) bits.push(`🥅${p.own_goals}pp`);
                            if ((p.interceptions || 0) > 0) bits.push(`🛡️${p.interceptions}`);
                            if ((p.shots || 0) > 0 || (p.shots_on_target || 0) > 0) bits.push(`👟${p.shots || 0}/${p.shots_on_target || 0}`);
                            if ((p.passes || 0) > 0 || (p.completed_passes || 0) > 0) bits.push(`🔁${p.completed_passes || 0}/${p.passes || 0}`);
                            if ((p.oles || 0) > 0) bits.push(`💃${p.oles}`);

                            const stats = bits.length
                                ? `<span style="color:var(--muted);font-size:14px">${bits.join(" ")}</span>`
                                : "";
                            const rating = fmtRating(calcMatchRating(p, m));
                            const ratingHtml = `<span style="color:var(--gold);font-weight:700;font-size:14px">⭐${rating}</span>`;
                            const elo = p.elo_before != null ? (p.elo_change > 0 ? `+${p.elo_change}` : p.elo_change) : "";
                            const eloColor = p.elo_change > 0 ? "var(--green)" : p.elo_change < 0 ? "var(--red)" : "var(--muted)";
                            const eloHtml = elo ? `<span style="color:${eloColor};font-weight:700;font-size:14px">${elo}</span>` : "";
                            row.innerHTML = `<span>${nameLink}</span><span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">${ratingHtml}${stats}${eloHtml}</span>`;
                            list.append(row);
                        });
                    }
                    wrap.append(list);
                    return wrap;
                }

                cols.append(buildCol("red", "var(--red)"));
                cols.append(buildCol("blue", "var(--blue)"));
                card.append(cols);

                card.style.cursor = "pointer";
                card.addEventListener("click", (e) => {
                    if (e.target.tagName === "A") return;
                    location.href = "match.html?id=" + m.id;
                });
                listEl.append(card);
            });

            pagEl.innerHTML = "";
            if (offset > 0) {
                const prev = document.createElement("button");
                prev.className = "btn btn-sm";
                prev.textContent = "← Anterior";
                prev.addEventListener("click", () => { offset -= PAGE_SIZE; load(); });
                pagEl.append(prev);
            }
            if (matches.length === PAGE_SIZE) {
                const next = document.createElement("button");
                next.className = "btn btn-sm";
                next.style.marginLeft = "10px";
                next.textContent = "Siguiente →";
                next.addEventListener("click", () => { offset += PAGE_SIZE; load(); });
                pagEl.append(next);
            }
        }

        function fmtDate(iso) {
            if (!iso) return "—";
            const d = new Date(iso);
            return d.toLocaleString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
        }
        function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

        load();
    </script>
</body>
</html>
