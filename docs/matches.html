<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidas | Haxball Futsal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <a class="brand" href="index.html">Haxball <span>Futsal</span></a>
            <nav>
                <a href="index.html" data-nav>Inicio</a>
                <a href="players.html" data-nav>Jugadores</a>
                <a href="matches.html" data-nav>Partidas</a>
                <a href="verify.html" data-nav>Verificar cuenta</a>
                <div class="auth-box" id="auth-box"></div>
            </nav>
        </div>
    </header>
    <main class="container">
        <h1>Partidas</h1>
        <div id="matches-list" class="loading">Cargando...</div>
        <div id="pagination" style="text-align:center;margin-top:20px"></div>
    </main>
    <footer>Haxball Futsal · Estadísticas públicas</footer>
    <script type="module">
        import { renderAuthBox, setActiveNav, fetchRecentMatches } from "./js/common.js";
        setActiveNav();
        renderAuthBox(document.getElementById("auth-box"));

        const PAGE_SIZE = 20;
        let offset = 0;
        const listEl = document.getElementById("matches-list");
        const pagEl = document.getElementById("pagination");

        async function load() {
            listEl.classList.add("loading");
            listEl.innerHTML = "Cargando...";
            const { data, error } = await window.supabase
                .from("matches")
                .select("id,type,status,map_name,started_at,red_score,blue_score,elo_eligible,manual,end_reason")
                .order("started_at", { ascending: false })
                .range(offset, offset + PAGE_SIZE - 1);
            listEl.classList.remove("loading");
            if (error) { listEl.innerHTML = '<div class="empty">Error al cargar</div>'; console.error(error); return; }
            if (!data || !data.length) { listEl.innerHTML = '<div class="empty">No hay más partidas</div>'; pagEl.innerHTML = ""; return; }

            listEl.innerHTML = "";
            data.forEach((m) => {
                const div = document.createElement("div");
                div.className = "card";
                div.style.cursor = "pointer";
                const type = m.type === "official" ? "OFICIAL" : "INFORMAL";
                const statusBadge = `<span class="badge badge-${m.status}">${m.status}</span>`;
                div.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div>${statusBadge} <span class="badge badge-${m.type}">${type}</span> <strong>${m.map_name || "—"}</strong></div><div class="match-score"><span class="score-red">${m.red_score}</span> - <span class="score-blue">${m.blue_score}</span></div></div><div style="color:var(--muted);font-size:12px;margin-top:6px">${fmtDate(m.started_at)}${m.manual ? " · manual" : ""}${m.end_reason ? " · " + m.end_reason : ""}</div>`;
                div.addEventListener("click", () => location.href = "match.html?id=" + m.id);
                listEl.append(div);
            });

            pagEl.innerHTML = "";
            if (offset > 0) {
                const prev = document.createElement("button");
                prev.className = "btn btn-sm";
                prev.textContent = "← Anterior";
                prev.addEventListener("click", () => { offset -= PAGE_SIZE; load(); });
                pagEl.append(prev);
            }
            if (data.length === PAGE_SIZE) {
                const next = document.createElement("button");
                next.className = "btn btn-sm";
                next.style.marginLeft = "10px";
                next.textContent = "Siguiente →";
                next.addEventListener("click", () => { offset += PAGE_SIZE; load(); });
                pagEl.append(next);
            }
        }

        function fmtDate(iso) {
            if (!iso) return "—";
            const d = new Date(iso);
            return d.toLocaleString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
        }

        load();
    </script>
</body>
</html>
