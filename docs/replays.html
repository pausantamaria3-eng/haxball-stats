<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repeticiones | Haxball Futsal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <a class="brand" href="index.html">Haxball <span>Futsal</span></a>
            <nav>
                <a href="index.html" data-nav>Inicio</a>
                <a href="players.html" data-nav>Jugadores</a>
                <a href="matches.html" data-nav>Partidas</a>
                <a href="replays.html" data-nav>Repeticiones</a>
                <a href="verify.html" data-nav>Verificar cuenta</a>
                <div class="auth-box" id="auth-box"></div>
            </nav>
        </div>
    </header>
    <main class="container">
        <h1>Repeticiones de goles</h1>
        <p style="color:var(--muted);margin-top:-8px">Grabaciones originales de HaxBall (.hbr2), con todo el contexto del gol.</p>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
            <button class="btn btn-sm replay-filter active" data-filter="all">Todos</button>
            <button class="btn btn-sm replay-filter" data-filter="official">Oficiales</button>
            <button class="btn btn-sm replay-filter" data-filter="informal">Informales</button>
            <button class="btn btn-sm replay-filter" data-filter="golazo">🚀 Golazos</button>
            <span class="replay-sort-bar">
                <span>Ordenar:</span>
                <select id="replay-sort-key" class="replay-sort-select">
                    <option value="date">Fecha</option>
                    <option value="minute">Minuto</option>
                    <option value="xg">Probabilidad</option>
                    <option value="speed">Velocidad</option>
                    <option value="golazo">Golazo</option>
                </select>
                <button id="replay-sort-dir" class="btn btn-sm" type="button" title="Invertir orden" aria-label="Invertir orden">▼</button>
            </span>
        </div>

        <div id="replays-list" class="loading">Cargando repeticiones...</div>
    </main>
    <footer>Haxball Futsal · Estadísticas públicas</footer>

    <script type="module">
        import { fetchGoalReplays, renderAuthBox, setActiveNav, escapeHtml, fmtDate, fmtDuration, teamName, haxballReplayUrl, mountEmbeddedReplay } from "./js/common.js";

        setActiveNav();
        renderAuthBox(document.getElementById("auth-box"));

        const listEl = document.getElementById("replays-list");
        const params = new URLSearchParams(location.search);
        const focusGoal = params.get("goal");
        const autoPlay = params.get("autoplay") === "1";
        let allReplays = [];
        let currentFilter = "all";

        function fmtMinute(seconds) {
            const s = Number(seconds);
            if (!Number.isFinite(s)) return "—";
            const m = Math.floor(s / 60);
            const rest = Math.floor(s % 60);
            return m + ":" + String(rest).padStart(2, "0");
        }

        function scoreText(goal) {
            if (goal.score_before && goal.score_after) {
                return goal.score_before + " → " + goal.score_after;
            }
            const m = goal.matches || {};
            return (m.red_score ?? "?") + "-" + (m.blue_score ?? "?");
        }

        function scoreForTeam(goal) {
            const after = goal.score_after || scoreText(goal);
            const parts = String(after).split("-").map(Number);
            if (parts.length !== 2 || parts.some(n => !Number.isFinite(n))) return after;
            return goal.scoring_team === "blue" ? parts[1] + "-" + parts[0] : after;
        }

        function contextLine(goal) {
            const bits = [];
            const scorer = goal.player_name || "Autor desconocido";
            const own = goal.is_own_goal ? " (en propia)" : "";
            bits.push("<strong>" + escapeHtml(scorer) + own + "</strong> para el <strong>" + escapeHtml(scoreForTeam(goal)) + "</strong> del equipo " + teamName(goal.scoring_team));
            if (goal.assist_name) bits.push("🅰️ Asistencia de <strong>" + escapeHtml(goal.assist_name) + "</strong>");
            bits.push("⏱️ minuto " + fmtMinute(goal.elapsed_seconds));
            if (goal.is_golazo) bits.push("🚀 Golazo");
            if (goal.ball_speed_kmh) bits.push("💨 " + goal.ball_speed_kmh + " km/h");
            if (goal.xg != null) bits.push("📊 xG " + Number(goal.xg).toFixed(2));
            return bits.join(" · ");
        }

        function buildCard(goal) {
            const m = goal.matches || {};
            const typeClass = m.type === "official" ? "badge-official" : "badge-informal";
            const href = haxballReplayUrl(goal.replay_url);
            const card = document.createElement("div");
            card.className = "card replay-card";
            card.dataset.type = m.type || "informal";
            card.dataset.golazo = goal.is_golazo ? "1" : "0";
            card.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
                    <div>
                        <span class="badge ${typeClass}">${m.type === "official" ? "Oficial" : "Informal"}</span>
                        <span class="match-score score-${goal.scoring_team}" style="margin-left:8px">${escapeHtml(scoreText(goal))}</span>
                        <span style="color:var(--muted);font-size:13px;margin-left:8px">${escapeHtml(fmtDate(m.started_at))}</span>
                    </div>
                    <a href="match.html?id=${encodeURIComponent(m.id || "")}">Ver partida →</a>
                </div>
                <p style="font-size:16px;margin:12px 0 14px">⚽ ${contextLine(goal)}</p>
                <div class="replay-player" data-replay-url="${escapeHtml(goal.replay_url)}">
                    <button class="btn replay-load" type="button">▶ Reproducir aquí</button>
                    <a class="btn btn-sm" href="${escapeHtml(href)}" target="_blank" rel="noopener">Abrir en haxball.com ↗</a>
                </div>
                <div style="color:var(--muted);font-size:12px;margin-top:12px">${escapeHtml(m.map_name || "—")} · duración ${escapeHtml(fmtDuration(m.duration_seconds))}</div>
            `;

            const playerEl = card.querySelector(".replay-player");
            card.querySelector(".replay-load").addEventListener("click", () => {
                mountEmbeddedReplay(playerEl, goal.replay_url);
            });

            if (autoPlay && focusGoal && String(goal.id) === String(focusGoal)) {
                mountEmbeddedReplay(playerEl, goal.replay_url);
            }

            return card;
        }

        const sortKeyEl = document.getElementById("replay-sort-key");
        const sortDirEl = document.getElementById("replay-sort-dir");
        let sortKey = "date";
        let sortDir = -1;

        function replaySortValue(g) {
            if (sortKey === "minute") return Number(g.elapsed_seconds);
            if (sortKey === "xg") return g.xg != null ? Number(g.xg) : null;
            if (sortKey === "speed") return g.ball_speed_kmh != null ? Number(g.ball_speed_kmh) : null;
            if (sortKey === "golazo") return g.is_golazo ? 1 : 0;
            return g.matches && g.matches.started_at ? new Date(g.matches.started_at).getTime() : null;
        }

        function render() {
            listEl.innerHTML = "";
            const shown = allReplays.filter(g => {
                const m = g.matches || {};
                if (currentFilter === "official" || currentFilter === "informal") return m.type === currentFilter;
                if (currentFilter === "golazo") return Boolean(g.is_golazo);
                return true;
            }).slice().sort((a, b) => {
                const va = replaySortValue(a);
                const vb = replaySortValue(b);
                if (va == null || !Number.isFinite(va)) return vb == null || !Number.isFinite(vb) ? 0 : 1;
                if (vb == null || !Number.isFinite(vb)) return -1;
                return (va - vb) * sortDir;
            });
            if (!shown.length) {
                listEl.innerHTML = '<div class="empty">No hay repeticiones con este filtro.</div>';
                return;
            }
            shown.forEach(g => listEl.append(buildCard(g)));
        }

        document.querySelectorAll(".replay-filter").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".replay-filter").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        function updateSortArrow() {
            sortDirEl.textContent = sortDir === 1 ? "▲" : "▼";
            sortDirEl.title = sortDir === 1 ? "Ascendente (click para invertir)" : "Descendente (click para invertir)";
        }
        sortKeyEl.addEventListener("change", () => {
            sortKey = sortKeyEl.value;
            sortDir = -1;
            updateSortArrow();
            render();
        });
        sortDirEl.addEventListener("click", () => {
            sortDir = -sortDir;
            updateSortArrow();
            render();
        });
        updateSortArrow();

        fetchGoalReplays(150).then(rows => {
            listEl.classList.remove("loading");
            allReplays = rows.filter(g => Boolean(g.replay_url));

            if (focusGoal && allReplays.some(g => String(g.id) === String(focusGoal))) {
                allReplays = allReplays.filter(g => String(g.id) === String(focusGoal));
                currentFilter = "all";
                document.querySelectorAll(".replay-filter").forEach(b =>
                    b.classList.toggle("active", b.dataset.filter === "all")
                );
            }

            render();
        }).catch(err => {
            console.error(err);
            listEl.classList.remove("loading");
            listEl.innerHTML = '<div class="empty">No se pudieron cargar las repeticiones. Ejecuta primero el SQL <code>supabase/replays.sql</code> en Supabase y recarga la página.</div>';
        });
    </script>
</body>
</html>
